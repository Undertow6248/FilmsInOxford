name: Update listings

on:
  schedule:
    - cron: "17 4 * * *"   # every night, about 5am in Oxford
    - cron: "17 13 * * 2"  # Tuesday lunchtime too, when Vue and others publish the next week
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["scraper/**", "site/index.html", ".github/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chrome

      - name: Scrape cinemas and look films up on TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          HEADFUL: "1"
        run: xvfb-run -a node scraper/run.mjs

      - name: Save the new listings to the repo
        run: |
          git config user.name "listings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other commits (e.g. from the job on the owner's computer) may have landed while this ran:
          # put the new listings on top of the latest main rather than rebasing.
          mkdir -p "$RUNNER_TEMP/out" && cp site/data.json "$RUNNER_TEMP/out/" && cp -r data "$RUNNER_TEMP/out/"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/out/data.json" site/data.json && rm -rf data && cp -r "$RUNNER_TEMP/out/data" data
            git add -A site/data.json data/
            if git diff --cached --quiet; then break; fi
            git commit -q -m "Update listings $(date -u +%F)" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
